# =============================================================================
# CAPSTONE Backend — Local Development Services
# Usage: docker compose -f docker-compose.dev.yml up -d
# =============================================================================
# NOTE: PostgreSQL is commented out because .env already points to localhost:5432.
#       Uncomment the postgres section if you want a containerised database.
# NOTE: MQTT/Mosquitto is intentionally excluded (not used in v1).
# =============================================================================
# T025 — AI WORKER NETWORK ISOLATION (offline-only) — TRIỂN KHAI KHI CONTAINER HOÁ
# -----------------------------------------------------------------------------
# Kiến trúc hiện tại: AI worker KHÔNG phải service riêng — backend (NestJS)
# consume BullMQ rồi spawn Python pipeline (faster-whisper/pyannote) như child
# process. Vì vậy ranh giới cô lập mạng là CONTAINER BACKEND.
#
# Khi đóng gói backend thành container, để đảm bảo "no outbound internet" (T025):
#   1. Tạo network nội bộ: `networks: { internal-net: { internal: true } }`
#      (internal: true -> Docker KHÔNG cấp route ra ngoài Internet).
#   2. Gắn backend + redis + minio (+ postgres) vào `internal-net`; KHÔNG publish
#      port public cho backend nếu không cần.
#   3. Set env offline cho backend: TRANSCRIPTION_PROVIDER=local_faster_whisper,
#      WHISPER_LOCAL_FILES_ONLY=true, PYANNOTE_LOCAL_FILES_ONLY=true, và mount
#      model volume read-only (preload qua T-HF-001, KHÔNG tải runtime).
#   4. Verify: `docker exec <backend> curl -m5 https://huggingface.co` PHẢI fail,
#      `curl -m5 http://minio:9000` PHẢI pass (xem quickstart.md mục Security).
#
# Hiện redis/minio publish port ra host để backend chạy `npm run start:dev` trên
# host kết nối được (dev). Khi backend vào container chung network, bỏ publish.
# =============================================================================

services:
  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: capstone-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── MinIO (S3-compatible object storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: capstone-minio
    ports:
      - "9000:9000"   # API
      - "9002:9002"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9002"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── PostgreSQL (OPTIONAL — uncomment if not running PG locally) ────────────
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: capstone-postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: "123456"
  #     POSTGRES_DB: capstone_db
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

volumes:
  redis-data:
  minio-data:
  # pg-data:
